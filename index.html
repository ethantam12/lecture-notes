<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0f6; --surface:#ffffff; --surface-2:#f5f6fb; --ink:#1b2030;
    --muted:#5c6377; --faint:#8b93a7; --border:#dadfec; --accent:#2d4fd6;
    --accent-ink:#ffffff; --accent-soft:#e3e8fc; --danger:#c93a2c; --danger-soft:#f8e2df;
    --success:#1f8f63; --success-soft:#e0f3ea; --shadow: 0 1px 2px rgba(27,32,48,.04), 0 8px 24px rgba(27,32,48,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12141c; --surface:#1a1d29; --surface-2:#20232f; --ink:#e8eaf2;
      --muted:#9aa1b4; --faint:#6b7185; --border:#2b2f3f; --accent:#7c93ff;
      --accent-ink:#10142a; --accent-soft:#242c4d; --danger:#ff8a76; --danger-soft:#3a2320;
      --success:#57d19c; --success-soft:#1e3329; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:"Source Sans 3", system-ui, sans-serif; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums;}
  h1,h2,h3{font-family:"Fraunces", Georgia, serif; text-wrap:balance; margin:0;}
  button{font-family:inherit; font-size:inherit;}
  textarea, input{font-family:inherit; font-size:inherit; color:inherit;}

  .app{ display:flex; min-height:100vh; max-width:1280px; margin:0 auto; }
  .sidebar{ width:264px; flex:none; display:flex; flex-direction:column; padding:20px 16px; gap:16px; border-right:1px solid var(--border); background:var(--surface); }
  .brand{ display:flex; align-items:center; gap:10px; padding:2px 4px 8px; }
  .brand-mark{ width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; flex:none; }
  .brand-title{ font-family:"Fraunces", serif; font-weight:600; font-size:17px; }
  .brand-sub{ font-family:"IBM Plex Mono", monospace; font-size:11px; color:var(--faint); letter-spacing:.04em; text-transform:uppercase; }
  .course-list{ display:flex; flex-direction:column; gap:3px; overflow-y:auto; }
  .course-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; cursor:pointer; color:var(--muted); border:1px solid transparent; }
  .course-item:hover{ background:var(--surface-2); }
  .course-item.active{ background:var(--accent-soft); color:var(--ink); }
  .course-dot{ width:8px; height:8px; border-radius:50%; flex:none; background:var(--faint); }
  .course-item.active .course-dot{ background:var(--accent); }
  .course-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; font-size:13.5px; }
  .course-code{ font-family:"IBM Plex Mono", monospace; font-size:10.5px; color:var(--faint); }
  .add-course-btn{ background:none; border:1px dashed var(--border); color:var(--muted); border-radius:9px; padding:9px 10px; cursor:pointer; text-align:left; font-weight:600; font-size:13.5px; }
  .add-course-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .sidebar-foot{ margin-top:auto; font-size:11.5px; color:var(--faint); padding:4px; display:flex; flex-direction:column; gap:8px; }
  .sidebar-foot button{ align-self:flex-start; background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:0; }
  .sidebar-foot button:hover{ color:var(--accent); }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .main-header{ display:flex; align-items:center; gap:14px; padding:22px 28px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .main-header h1{ font-size:23px; flex:none; }
  .header-meta{ color:var(--faint); font-size:12.5px; font-family:"IBM Plex Mono", monospace; }
  .header-spacer{ flex:1; }
  .search-box{ display:flex; align-items:center; gap:7px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:6px 10px; min-width:160px; }
  .search-box input{ border:none; background:none; outline:none; color:var(--ink); width:100%; }
  .search-box svg{ flex:none; color:var(--faint); }
  .btn{ display:inline-flex; align-items:center; gap:7px; border-radius:8px; padding:9px 14px; font-weight:600; font-size:13.5px; cursor:pointer; border:1px solid transparent; white-space:nowrap; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-outline{ background:none; border-color:var(--border); color:var(--ink); }
  .btn-outline:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-ghost{ background:none; border:none; color:var(--muted); padding:6px 8px; }
  .btn-ghost:hover{ color:var(--ink); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .content{ flex:1; padding:20px 28px 40px; overflow-y:auto; }
  .empty-state{ display:flex; flex-direction:column; align-items:flex-start; gap:10px; color:var(--muted); padding:40px 4px; max-width:420px; }
  .empty-state h2{ font-size:19px; color:var(--ink); }
  .entry-list{ display:flex; flex-direction:column; gap:8px; }
  .entry-card{ display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:14px 16px; cursor:pointer; box-shadow:var(--shadow); }
  .entry-card:hover{ border-color:var(--accent); }
  .entry-icon{ width:32px; height:32px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent); }
  .entry-icon.note{ background:var(--surface-2); color:var(--muted); }
  .entry-main{ flex:1; min-width:0; }
  .entry-title{ font-weight:700; font-size:14.5px; margin-bottom:2px; }
  .entry-sub{ font-family:"IBM Plex Mono", monospace; font-size:11px; color:var(--faint); }
  .entry-snippet{ color:var(--muted); font-size:13px; margin-top:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry-actions{ display:flex; gap:2px; margin-left:auto; flex:none; opacity:0; transition:opacity .12s; }
  .entry-card:hover .entry-actions, .entry-actions:focus-within{ opacity:1; }
  .entry-action-btn{ background:none; border:none; cursor:pointer; color:var(--muted); padding:7px; border-radius:7px; display:flex; }
  .entry-action-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .entry-action-btn.danger:hover{ background:var(--danger-soft); color:var(--danger); }
  .list-toolbar{ display:flex; align-items:center; justify-content:flex-end; margin-bottom:10px; }
  .sort-select{ background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:12.5px; color:var(--muted); font-family:inherit; }
  .detail-back{ display:inline-flex; align-items:center; gap:6px; color:var(--muted); cursor:pointer; font-size:13px; font-weight:600; margin-bottom:14px; }
  .detail-back:hover{ color:var(--accent); }
  .detail-title-row{ display:flex; align-items:flex-start; gap:12px; margin-bottom:6px; }
  .detail-title{ font-family:"Fraunces", serif; font-weight:600; font-size:24px; flex:1; border:none; background:none; outline:none; color:var(--ink); padding:2px 0; text-wrap:balance; }
  .detail-date{ font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--faint); margin-bottom:18px; }
  .player-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
  .player-row audio{ width:100%; }
  .panel{ margin-bottom:22px; }
  .panel-label{ font-family:"IBM Plex Mono", monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .panel textarea{ width:100%; min-height:120px; resize:vertical; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; color:var(--ink); outline:none; line-height:1.6; }
  .panel textarea:focus{ border-color:var(--accent); }
  .save-dot{ width:6px; height:6px; border-radius:50%; background:var(--success); opacity:0; transition:opacity .3s; }
  .save-dot.show{ opacity:1; }
  .detail-actions{ display:flex; gap:8px; margin-top:8px; }
  .rec-panel{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px; max-width:640px; box-shadow:var(--shadow); }
  .rec-title-input{ width:100%; font-family:"Fraunces", serif; font-size:20px; font-weight:600; border:none; background:none; outline:none; color:var(--ink); margin-bottom:18px; padding:2px 0; }
  .rec-status{ display:flex; align-items:center; gap:20px; margin-bottom:20px; }
  .rec-dot{ width:12px; height:12px; border-radius:50%; background:var(--danger); flex:none; }
  .rec-dot.live{ animation: pulse 1.4s infinite; }
  @media (prefers-reduced-motion: reduce){ .rec-dot.live{ animation:none; } }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  .rec-timer{ font-family:"IBM Plex Mono", monospace; font-size:30px; font-weight:500; }
  .rec-note{ color:var(--faint); font-size:12.5px; }
  .live-caption{ background:#0b0d14; color:#fdfdff; font-size:21px; font-weight:600; line-height:1.45; text-align:center; padding:20px 26px; border-radius:12px; min-height:88px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; transition:opacity .12s ease; }
  .live-caption.empty{ color:rgba(255,255,255,.55); font-weight:500; font-size:15px; }
  .transcript-label{ font-family:"IBM Plex Mono", monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin-bottom:6px; }
  .rec-transcript{ background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:14px; height:110px; overflow-y:auto; color:var(--muted); font-size:13px; line-height:1.6; margin-bottom:20px; }
  .rec-transcript .final{ color:var(--ink); }
  .rec-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .rec-warn{ background:var(--danger-soft); color:var(--danger); border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:16px; }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(15,17,26,.4); backdrop-filter:blur(2px); display:flex; align-items:flex-start; justify-content:center; padding:10vh 16px; z-index:50; }
  .modal{ background:var(--surface); border-radius:14px; padding:24px; width:100%; max-width:420px; box-shadow:var(--shadow); border:1px solid var(--border); }
  .modal h3{ font-size:18px; margin-bottom:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; }
  .field input, .field textarea{ width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:9px 11px; outline:none; color:var(--ink); }
  .field input:focus, .field textarea:focus{ border-color:var(--accent); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  .banner{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; color:var(--muted); font-size:13.5px; margin:0 0 18px; }

  .slides-grid{ display:flex; flex-wrap:wrap; gap:12px; }
  .slide-card{ position:relative; width:120px; }
  .slide-thumb{ width:120px; height:90px; object-fit:cover; border-radius:8px; border:1px solid var(--border); display:block; background:var(--surface-2); }
  .slide-pdf{ display:flex; align-items:center; justify-content:center; width:120px; height:90px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--muted); font-size:12px; text-align:center; text-decoration:none; padding:8px; overflow:hidden; }
  .slide-remove{ position:absolute; top:2px; right:2px; background:var(--surface); border-radius:6px; padding:3px; }
  .ai-panel{ background:var(--accent-soft); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .ask-input{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:9px 11px; outline:none; color:var(--ink); }
  .ask-input:focus{ border-color:var(--accent); }
  .ai-answer{ margin-top:12px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 14px; font-size:13.5px; line-height:1.6; white-space:pre-wrap; }

  .flashcard-stage{ display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:4px; }
  .flashcard{ width:100%; min-height:180px; background:var(--accent-soft); border:1px solid var(--border); border-radius:14px; padding:24px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:16px; line-height:1.55; cursor:pointer; user-select:none; }
  .flashcard.back{ background:var(--surface-2); }
  .flashcard-hint{ color:var(--faint); font-size:11.5px; }
  .flashcard-nav{ display:flex; align-items:center; gap:14px; }
  .flashcard-count{ font-family:"IBM Plex Mono", monospace; font-size:12.5px; color:var(--muted); }
  .quiz-progress{ font-family:"IBM Plex Mono", monospace; font-size:12px; color:var(--faint); margin-bottom:10px; }
  .quiz-question{ font-size:15.5px; font-weight:600; margin-bottom:14px; line-height:1.5; }
  .quiz-choice{ display:block; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:11px 14px; margin-bottom:8px; cursor:pointer; font-size:13.5px; color:var(--ink); }
  .quiz-choice:hover:not(:disabled){ border-color:var(--accent); }
  .quiz-choice.correct{ border-color:var(--success); background:var(--success-soft); }
  .quiz-choice.incorrect{ border-color:var(--danger); background:var(--danger-soft); }
  .quiz-choice:disabled{ cursor:default; opacity:.9; }
  .quiz-explain{ font-size:12.5px; color:var(--muted); margin:10px 0 4px; line-height:1.5; }
  .quiz-score{ font-size:20px; font-family:"Fraunces", serif; margin-bottom:6px; }
  .chat-messages{ height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:4px 2px; margin-bottom:12px; }
  .chat-msg{ max-width:80%; padding:9px 13px; border-radius:12px; font-size:13.5px; line-height:1.5; white-space:pre-wrap; }
  .chat-msg.user{ align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:3px; }
  .chat-msg.assistant{ align-self:flex-start; background:var(--surface-2); border:1px solid var(--border); border-bottom-left-radius:3px; }
  .chat-msg.thinking{ opacity:.6; }

  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px; box-shadow:var(--shadow); }
  .auth-card h1{ font-size:22px; margin-bottom:6px; }
  .auth-sub{ color:var(--faint); font-size:13px; margin-bottom:24px; }

  @media (max-width: 780px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; align-items:center; border-right:none; border-bottom:1px solid var(--border); padding:12px 16px; }
    .brand{ padding:0; }
    .brand-sub{ display:none; }
    .course-list{ flex-direction:row; overflow-x:auto; flex:1; }
    .course-item{ flex:none; }
    .add-course-btn{ flex:none; white-space:nowrap; }
    .sidebar-foot{ display:none; }
    .main-header{ padding:18px 16px 12px; }
    .content{ padding:16px 16px 40px; }
  }
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap" style="display:none;">
  <div class="auth-card">
    <h1>Lecture Notes</h1>
    <div class="auth-sub">Sign in to your notebook. The first time, just pick any email + password — that creates your account.</div>
    <div class="field"><label>Email</label><input type="email" id="authEmail" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="authPassword" autocomplete="current-password"></div>
    <div id="authWarn"></div>
    <button class="btn btn-primary" id="authBtn" style="width:100%;justify-content:center;">Continue</button>
  </div>
</div>

<div class="app" id="app" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="2"/><path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div><div class="brand-title">Lecture Notes</div><div class="brand-sub" id="termLabel">&nbsp;</div></div>
    </div>
    <div class="course-list" id="courseList"></div>
    <button class="add-course-btn" id="addCourseBtn">+ Add course</button>
    <div class="sidebar-foot"><span id="userEmailLabel"></span><button id="signOutBtn">Sign out</button></div>
  </aside>
  <main class="main">
    <header class="main-header" id="mainHeader"></header>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="modalRoot"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="ai-config.js"></script>
<script>
(function(){
  "use strict";

  if (!window.firebaseConfig || window.firebaseConfig.apiKey === "PASTE_API_KEY_HERE"){
    document.body.innerHTML = '<div style="max-width:520px;margin:15vh auto;padding:24px;font-family:sans-serif;line-height:1.6;">' +
      '<h2>Almost set up</h2><p>Open <code>firebase-config.js</code> and paste in your Firebase project\'s config values, then re-upload it.</p></div>';
    return;
  }
  if (!window.supabaseConfig || window.supabaseConfig.url === "PASTE_SUPABASE_URL_HERE"){
    document.body.innerHTML = '<div style="max-width:520px;margin:15vh auto;padding:24px;font-family:sans-serif;line-height:1.6;">' +
      '<h2>Almost set up</h2><p>Open <code>supabase-config.js</code> and paste in your Supabase project URL and anon key, then re-upload it.</p></div>';
    return;
  }

  firebase.initializeApp(window.firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();
  var sb = window.supabase.createClient(window.supabaseConfig.url, window.supabaseConfig.anonKey);
  var BUCKET = "recordings";

  function sbUpload(path, fileOrBlob, contentType){
    return sb.storage.from(BUCKET).upload(path, fileOrBlob, { contentType: contentType, upsert: true }).then(function(res){
      if (res.error) throw res.error;
      return res.data;
    });
  }
  function sbRemove(path){
    return sb.storage.from(BUCKET).remove([path]).then(function(res){
      if (res.error) throw res.error;
      return res.data;
    });
  }
  function sbPublicUrl(path){
    var res = sb.storage.from(BUCKET).getPublicUrl(path);
    return res && res.data && res.data.publicUrl;
  }

  // ---------------------------------------------------------------
  // AI Q&A (optional — only active if ai-config.js has a real worker URL)
  // ---------------------------------------------------------------
  var AI_ENABLED = !!(window.aiConfig && window.aiConfig.workerUrl && window.aiConfig.workerUrl !== "PASTE_WORKER_URL_HERE");
  function askAI(question, ctx){
    ctx = ctx || {};
    return fetch(window.aiConfig.workerUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: question,
        transcript: ctx.transcript || "",
        notes: ctx.notes || "",
        slideUrls: ctx.slideUrls || []
      })
    }).then(function(res){
      return res.json().then(function(data){
        if (!res.ok) throw new Error(data && data.error || "Request failed");
        return data.answer || "(no answer)";
      });
    });
  }
  function askAIChat(question, history, ctx){
    ctx = ctx || {};
    return fetch(window.aiConfig.workerUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: "chat",
        question: question,
        history: history || [],
        transcript: ctx.transcript || "",
        notes: ctx.notes || "",
        slideUrls: ctx.slideUrls || []
      })
    }).then(function(res){
      return res.json().then(function(data){
        if (!res.ok) throw new Error(data && data.error || "Request failed");
        return data.answer || "(no answer)";
      });
    });
  }
  function generateStudyItems(genType, count, ctx){
    ctx = ctx || {};
    return fetch(window.aiConfig.workerUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: "generate",
        genType: genType,
        count: count || 10,
        transcript: ctx.transcript || "",
        notes: ctx.notes || ""
      })
    }).then(function(res){
      return res.json().then(function(data){
        if (!res.ok) throw new Error(data && data.error || "Request failed");
        if (!Array.isArray(data.items)) throw new Error("The AI didn't return usable results. Try again.");
        return data.items;
      });
    });
  }
  function transcribeAudio(audioUrl){
    return fetch(window.aiConfig.workerUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: "transcribe", audioUrl: audioUrl })
    }).then(function(res){

  // ---------------------------------------------------------------

  function subscribeCourses(){
    state.unsubCourses = db.collection("courses").orderBy("createdAt","asc").onSnapshot(function(snap){
      state.courses = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderSidebar();
      if (!state.currentCourseId){
        var remembered = lsGet("lecnotes.lastCourse");
        var pick = state.courses.find(function(c){ return c.id === remembered; }) || state.courses[0];
        if (pick) selectCourse(pick.id); else render();
      } else {
        renderHeader();
      }
    }, function(){});
  }

  function selectCourse(id){
    if (state.unsubEntries) { state.unsubEntries(); state.unsubEntries = null; }
    state.currentCourseId = id;
    state.currentEntryId = null;
    state.view = "list";
    state.searchTerm = "";
    state.entries = [];
    lsSet("lecnotes.lastCourse", id);
    renderSidebar(); renderHeader();
    renderEmpty("Loading…","");

      state.entries = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      if (state.view === "detail"){
        var still = state.entries.find(function(e){ return e.id === state.currentEntryId; });
        if (!still){ state.view = "list"; state.currentEntryId = null; }
      }

    }, function(){});
  }

  function addCourse(data){

    db.collection("courses").add(body).then(function(ref){ selectCourse(ref.id); }).catch(function(err){ alert("Couldn't add the course: " + err.message); });
  }

  function deleteCourse(id){
    var course = state.courses.find(function(c){ return c.id === id; });
    if (!course) return;
    if (!confirm('Delete "' + course.name + '" and everything recorded in it? This can\'t be undone.')) return;
    db.collection("courses/" + id + "/entries").get().then(function(snap){
      var jobs = snap.docs.map(function(d){
        var data = d.data();
        var job = data.audioPath ? sbRemove(data.audioPath).catch(function(){}) : Promise.resolve();
        return job.then(function(){ return db.doc("courses/" + id + "/entries/" + d.id).delete(); });
      });
      return Promise.all(jobs);
    }).catch(function(){}).then(function(){
      return db.doc("courses/" + id).delete();
    }).then(function(){
      if (state.currentCourseId === id){ state.currentCourseId = null; lsSet("lecnotes.lastCourse",""); }
    });
  }

  // ---------------------------------------------------------------
  // Recording (live mic — works for real here, no sandbox)
  // ---------------------------------------------------------------
  function defaultRecTitle(){

    return course ? (course.code || course.name) + " — " + stamp : "Lecture — " + stamp;
  }
  function pickMimeType(){

    for (var i=0;i<cands.length;i++){ if (window.MediaRecorder && MediaRecorder.isTypeSupported(cands[i])) return cands[i]; }

  function openCaptureChoice(){

  function chooseLiveMode(){
    rec = {

      stream: null, recorder: null, chunks: [], finishing: false, uploading: false,
      finalTranscript: "", interimTranscript: "", recognition: null, priorTranscript: "",

      mimeType: pickMimeType(), error: null, slideFiles: [], lastResultAt: 0, watchdogInt: null,
      aiTranscript: [], aiChunkIndex: 0, aiChunking: false, currentChunkRecorder: null, pendingChunkPromises: []

  function chooseImportMode(){

  function beginCapture(){

    // tuned for close-talking calls and can quietly clip out a professor's
    // voice from across a room by mistaking it for background noise;
    // autoGainControl instead boosts quiet/distant speech up to a usable level.
    navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation:false, noiseSuppression:false, autoGainControl:true, channelCount:1,
      sampleRate:{ ideal:48000 }, sampleSize:{ ideal:16 }
    } }).then(function(stream){
      rec.stream = stream;
      rec.active = true;
      rec.startedAt = Date.now();
      rec.chunks = [];
      rec.recorder = new MediaRecorder(stream, { mimeType: rec.mimeType, audioBitsPerSecond: AUDIO_BITRATE });
      rec.recorder.ondataavailable = function(e){ if (e.data && e.data.size > 0) rec.chunks.push(e.data); };
      rec.recorder.onstop = function(){ finalizeRecording(); };
      rec.recorder.start();
      rec.timerInt = setInterval(function(){
        rec.elapsedSec = (Date.now() - rec.startedAt) / 1000;
        var t = document.getElementById("recTimer");
        if (t) t.textContent = fmtTimer(rec.elapsedSec);
      }, 500);
      if (rec.supportsSpeech) startRecognition();
      if (AI_ENABLED) startAiChunking();
      renderContent();
    }).catch(function(err){
      rec.error = "Couldn't access your microphone (" + (err && err.name || "error") + "). Check permissions and try again.";
      renderContent();
    });
  }

  function stopRecordingFlow(discard){
    if (!rec) return;
    clearInterval(rec.timerInt);
    stopRecognition();
    stopAiChunking();
    if (discard){
      if (rec.stream) rec.stream.getTracks().forEach(function(t){ t.stop(); });
      if (rec.recorder && rec.recorder.state !== "inactive"){ rec.recorder.onstop = function(){}; rec.recorder.stop(); }
      rec = null; backToList(); return;
    }
    rec.finishing = true;
    renderContent();
    // Give any AI chunk transcriptions still in flight (including the very
    // last, just-stopped chunk) a chance to land before building the final
    // transcript — capped so a slow/failed request can't stall saving forever.
    var waitForChunks = Promise.race([
      Promise.all(rec.pendingChunkPromises || []),
      new Promise(function(resolve){ setTimeout(resolve, 12000); })

      if (rec.recorder && rec.recorder.state !== "inactive") rec.recorder.stop();
      else finalizeRecording();
    });

  // Combines whatever the periodic AI re-transcription produced during the
  // recording into the final transcript, falling back to the live Web Speech
  // captions if AI chunking wasn't enabled or most chunks failed (e.g. AI
  // quota hit) — so a rough transcript is still always saved either way.
  function buildFinalTranscript(){
    var parts = (rec && rec.aiTranscript) || [];
    var total = (rec && rec.aiChunkIndex) || 0;
    var have = parts.filter(function(t){ return t && t.trim(); }).length;
    if (total > 0 && have >= Math.ceil(total * 0.6)){
      var combined = [];
      for (var i = 0; i < total; i++){
        combined.push(parts[i] && parts[i].trim() ? parts[i].trim() : "[segment unavailable]");
      }

  function finalizeRecording(){

    if (rec.stream) rec.stream.getTracks().forEach(function(t){ t.stop(); });
    var blob = new Blob(rec.chunks, { type: rec.mimeType.split(";")[0] });
    var courseId = state.currentCourseId;
    var title = rec.title;
    var durationSec = Math.round(rec.elapsedSec);
    var priorPart = (rec.priorTranscript || "").trim();
    var transcript = (priorPart ? priorPart + "\n\n" : "") + buildFinalTranscript();
    var slideFiles = (rec.slideFiles || []).slice();
    var ext = rec.mimeType.indexOf("ogg") > -1 ? "ogg" : (rec.mimeType.indexOf("mp4") > -1 ? "m4a" : "webm");
    rec.uploading = true;

    var entryId = db.collection("courses/" + courseId + "/entries").doc().id;
    var path = courseId + "/" + entryId + "." + ext;
    sbUpload(path, blob, blob.type).then(function(){
      return db.doc("courses/" + courseId + "/entries/" + entryId).set({
        type: "lecture", title: title, date: nowIso(), durationSec: durationSec,
        audioPath: path, transcript: transcript, notesText: "", slidePaths: [], createdAt: nowIso()

      renderContent();

  // The Web Speech API only keeps words shown as "interim" (the light/live
  // preview text) around until they're marked final — but every restart of
  // the recognizer (whether from a normal onend or the watchdog below)
  // starts a brand-new session that has no memory of that pending text, so
  // anything still "interim" at that exact moment is silently thrown away.
  // That's the "words show up for a second then vanish" behavior. Flushing
  // whatever is currently interim into the permanent transcript right before
  // any restart (or before the user stops recording) fixes it.
  // Pulls just the tail end of the transcript so the live caption reads like
  // TV subtitles — a short, current line — rather than the whole growing wall
  // of text. Trims to a whole-word boundary so it doesn't start mid-word.
  function captionSnippet(text, maxChars){
    text = String(text || "").replace(/\s+/g, " ").trim();
    if (!text) return "";
    if (text.length <= maxChars) return text;
    var slice = text.slice(-maxChars);

  function emptyCaptionMessage(){
    if (rec && rec.supportsSpeech) return "Listening…";
    if (AI_ENABLED) return "Live captions aren't supported in this browser — AI is transcribing in the background instead.";
    return "Live captions aren't supported in this browser.";
  }
  function updateTranscriptUI(){
    if (!rec) return;
    var full = rec.finalTranscript || "";
    var interim = rec.interimTranscript || "";
    var box = document.getElementById("recTranscript");
    if (box){
      box.innerHTML = '<span class="final">' + esc(full) + '</span>' + esc(interim);
      box.scrollTop = box.scrollHeight;
    }
    var caption = document.getElementById("liveCaption");
    if (caption){
      var snippet = captionSnippet(full + interim, 130);
      if (snippet){ caption.textContent = snippet; caption.classList.remove("empty"); }
      else { caption.textContent = emptyCaptionMessage(); caption.classList.add("empty"); }
    }
  }
  function flushInterim(){

      try{ r.abort(); }catch(e){}
    }
  }

  // ---------------------------------------------------------------
  // AI-powered live transcription: the browser's own live captions
  // (above) are a real-time best-effort guess. Underneath, a second,
  // independent MediaRecorder on the same microphone stream is stopped
  // and restarted every AI_CHUNK_MS to produce short, self-contained
  // audio clips, each of which gets sent to the AI for a proper
  // transcription — the same technique as "Improve with AI", just run
  // continuously in the background in ~30-second slices instead of once
  // at the end. This is what actually ends up saved as the transcript;
  // the live captions are just a preview while you're recording.
  // ---------------------------------------------------------------
  function blobToBase64(blob){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ var s = String(reader.result || ""); resolve(s.split(",")[1] || ""); };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }
  function transcribeChunk(blob, idx){
    var p = blobToBase64(blob).then(function(b64){
      return fetch(window.aiConfig.workerUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: "transcribe", audioBase64: b64, mimeType: (blob.type || rec.mimeType || "audio/webm").split(";")[0] })
      });
    }).then(function(res){
      return res.json().then(function(data){
        if (!res.ok) throw new Error(data && data.error || "Request failed");
        return data.transcript || "";
      });
    }).then(function(t){
      if (rec) rec.aiTranscript[idx] = t.trim();
    }).catch(function(){
      // Leave this slot empty — buildFinalTranscript() falls back gracefully
      // to the live captions if too many chunks come back empty.
    });
    if (rec) rec.pendingChunkPromises = (rec.pendingChunkPromises || []).concat([p]);
    return p;
  }
  function scheduleNextAiChunk(){
    if (!rec || !rec.aiChunking || !rec.active || !rec.stream) return;
    var chunkRecorder;
    try{ chunkRecorder = new MediaRecorder(rec.stream, { mimeType: rec.mimeType, audioBitsPerSecond: AUDIO_BITRATE }); }
    catch(e){ return; }
    var localChunks = [];
    chunkRecorder.ondataavailable = function(ev){ if (ev.data && ev.data.size > 0) localChunks.push(ev.data); };
    chunkRecorder.onstop = function(){
      var idx = rec ? rec.aiChunkIndex++ : 0;
      if (rec && rec.aiChunking) scheduleNextAiChunk();
      var blob = new Blob(localChunks, { type: (chunkRecorder.mimeType || rec.mimeType || "audio/webm").split(";")[0] });
      if (blob.size > 2000) transcribeChunk(blob, idx);
    };
    rec.currentChunkRecorder = chunkRecorder;
    try{ chunkRecorder.start(); }catch(e){ return; }
    setTimeout(function(){
      if (rec && rec.currentChunkRecorder === chunkRecorder && chunkRecorder.state !== "inactive"){
        try{ chunkRecorder.stop(); }catch(e){}
      }
    }, AI_CHUNK_MS);
  }
  function startAiChunking(){
    if (!rec) return;
    rec.aiTranscript = [];
    rec.aiChunkIndex = 0;
    rec.pendingChunkPromises = [];
    rec.aiChunking = true;
    scheduleNextAiChunk();
  }
  function stopAiChunking(){
    if (!rec) return;
    rec.aiChunking = false;
    if (rec.currentChunkRecorder && rec.currentChunkRecorder.state !== "inactive"){
      try{ rec.currentChunkRecorder.stop(); }catch(e){}
    }
  }

  function beginImportUpload(){
    if (!rec || !rec.file) return;
    rec.uploading = true;
    rec.error = null;
    renderContent();
    var courseId = state.currentCourseId;
    var file = rec.file;
    var slideFiles = (rec.slideFiles || []).slice();
    var ext = (file.name.split(".").pop() || "webm").toLowerCase();
    var entryId = db.collection("courses/" + courseId + "/entries").doc().id;
    var path = courseId + "/" + entryId + "." + ext;
    sbUpload(path, file, file.type || "application/octet-stream").then(function(){
      return db.doc("courses/" + courseId + "/entries/" + entryId).set({
        type: "lecture", title: rec.title, date: nowIso(), durationSec: 0,
        audioPath: path, transcript: (rec.pastedTranscript || "").trim(), notesText: "", slidePaths: [], createdAt: nowIso()
      });
    }).then(function(){
      return Promise.all(slideFiles.map(function(f){ return uploadSlide({id: entryId}, f).catch(function(){}); }));
    }).then(function(){ rec = null; openEntry(entryId); }).catch(function(err){
      rec.uploading = false; rec.error = "Couldn't upload that file (" + (err && err.message || err) + "). Try again.";
      renderContent();
    });
  }

  function renderEmpty(title, sub){
    var content = document.getElementById("content");
    content.innerHTML = "";
    content.appendChild(el("div",{class:"empty-state"},[ el("h2",{},[text(title)]), sub ? el("div",{},[text(sub)]) : null ]));
  }

  function renderContent(){
    var content = document.getElementById("content");
    content.innerHTML = "";
    if (state.view === "home"){ renderHomeDashboard(content); return; }
    if (!state.currentCourseId){
      if (state.courses.length === 0){
        content.appendChild(el("div",{class:"empty-state"},[
          el("h2",{},[text("Start your notebook")]),
          el("div",{},[text("Add your first course to begin recording lectures and keeping notes.")]),
          el("button",{class:"btn btn-primary", style:"margin-top:6px;", onclick: openCourseModal},[text("+ Add a course")])
        ]));
      }
      return;
    }
    if (state.view === "recording"){ renderRecordingPanel(content); return; }
    if (state.view === "detail"){ renderDetail(content); return; }

    var items = state.entries.slice();
    if (state.searchTerm.trim()){
      var q = state.searchTerm.trim().toLowerCase();
      items = items.filter(function(e){
        return (e.title||"").toLowerCase().indexOf(q) > -1 || (e.transcript||"").toLowerCase().indexOf(q) > -1 || (e.notesText||"").toLowerCase().indexOf(q) > -1;
      });
    }
    if (state.sortBy === "oldest"){
      items.sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); });
    } else if (state.sortBy === "title"){
      items.sort(function(a,b){ return (a.title||"").toLowerCase().localeCompare((b.title||"").toLowerCase()); });
    } else {
      items.sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
    }
    var toolbar = el("div",{class:"list-toolbar"});
    var sortSelect = el("select",{class:"sort-select"},[
      el("option",{value:"newest"},[text("Newest first")]),
      el("option",{value:"oldest"},[text("Oldest first")]),
      el("option",{value:"title"},[text("Title A–Z")])
    ]);
    sortSelect.value = state.sortBy;
    sortSelect.addEventListener("change", function(){ state.sortBy = sortSelect.value; renderContent(); });
    toolbar.appendChild(sortSelect);
    content.appendChild(toolbar);
    if (items.length === 0){
      content.appendChild(el("div",{class:"empty-state"},[
        el("h2",{},[text(state.entries.length ? "No matches" : "Nothing here yet")]),
        el("div",{},[text(state.entries.length ? "Try a different search." : "Record a lecture or add a note to get started with this course.")])
      ]));
      return;
    }
    var list = el("div",{class:"entry-list"});
    items.forEach(function(e){
      var isLecture = e.type === "lecture";
      var isTranscript = e.type === "transcript";
      var iconName = isLecture ? "mic" : (isTranscript ? "transcript" : "note");
      var renameBtn = el("button",{class:"entry-action-btn", title:"Rename", type:"button", onclick: function(ev){
        ev.stopPropagation();
        var next = prompt("Rename this entry:", e.title || "");
        if (next !== null && next.trim()) updateEntry(e.id, {title: next.trim()});
      }},[icon("pencil")]);
      var deleteBtn = el("button",{class:"entry-action-btn danger", title:"Delete", type:"button", onclick: function(ev){
        ev.stopPropagation();
        deleteEntry(e.id);
      }},[icon("trash")]);
      var card = el("div",{class:"entry-card", onclick: function(){ openEntry(e.id); }},[
        el("div",{class:"entry-icon" + (isLecture?"":" note")},[icon(iconName)]),
        el("div",{class:"entry-main"},[
          el("div",{class:"entry-title"},[text(e.title || "Untitled")]),
          el("div",{class:"entry-sub mono"},[text(fmtDate(e.date) + (isLecture && e.durationSec ? " · " + fmtDuration(e.durationSec) : ""))]),
          el("div",{class:"entry-snippet"},[text((e.notesText || e.transcript || "").slice(0,140))])
        ]),
        el("div",{class:"entry-actions"},[renameBtn, deleteBtn])
      ]);
      list.appendChild(card);
    });
    content.appendChild(list);
  }

  function renderHomeDashboard(content){
    if (state.courses.length === 0){

        el("h2",{},[text("Start your notebook")]),

  function renderTranscriptField(label, placeholder, getValue, setValue){
    var panel = el("div",{class:"panel"});
    var ta = el("textarea",{placeholder: placeholder});
    ta.value = getValue() || "";
    ta.addEventListener("input", function(){ setValue(ta.value); });
    var fileInput = el("input",{type:"file", accept:".txt,text/plain", style:"display:none;"});
    fileInput.addEventListener("change", function(){
      var file = fileInput.files && fileInput.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        var incoming = String(reader.result || "");
        var replace = true;
        if ((ta.value || "").trim()){
          replace = confirm("Replace the existing text with this file's contents? Click Cancel to append instead.");
        }
        ta.value = replace ? incoming : (ta.value + "\n\n" + incoming);
        setValue(ta.value);
      };
      reader.onerror = function(){ alert("Couldn't read that file."); };
      reader.readAsText(file);
      fileInput.value = "";
    });
    var uploadBtn = el("button",{class:"btn btn-outline", type:"button", style:"padding:4px 10px; font-size:12.5px;", onclick: function(){ fileInput.click(); }},[text("Upload .txt file")]);
    panel.appendChild(el("div",{class:"panel-label", style:"display:flex; align-items:center; justify-content:space-between;"},[
      el("div",{},[text(label)]),
      uploadBtn
    ]));
    panel.appendChild(fileInput);
    panel.appendChild(ta);
    return panel;
  }

  function renderSlidePicker(getFiles, setFiles){
    var panel = el("div",{class:"panel"});
    var listWrap = el("div",{style:"display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 2px;"});
    function renderList(){
      listWrap.innerHTML = "";
      (getFiles() || []).forEach(function(f, idx){
        var chip = el("div",{style:"display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:5px 6px 5px 10px; font-size:12.5px; max-width:220px;"},[
          el("span",{style:"overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"},[text(f.name)]),
          el("button",{class:"btn-ghost", style:"padding:2px;", type:"button", title:"Remove", onclick: function(){
            var files = (getFiles() || []).slice(); files.splice(idx,1); setFiles(files); renderList();
          }},[icon("trash")])
        ]);
        listWrap.appendChild(chip);
      });
    }
    var fileInput = el("input",{type:"file", accept:"image/*,.pdf", multiple:"multiple"});
    fileInput.addEventListener("change", function(){
      var picked = Array.prototype.slice.call(fileInput.files || []);
      if (!picked.length) return;
      setFiles((getFiles() || []).concat(picked));
      fileInput.value = "";
      renderList();
    });
    panel.appendChild(el("div",{class:"panel-label"},[text("Slides (optional)")]));
    panel.appendChild(el("div",{class:"rec-note", style:"margin-bottom:2px;"},[text("Attach slide images or PDFs now — they'll be saved with this recording once it's done.")]));
    panel.appendChild(fileInput);
    panel.appendChild(listWrap);
    renderList();
    return panel;
  }

  function renderRecordingPanel(content){
    var panel = el("div",{class:"rec-panel"});
    if (!rec){ content.appendChild(panel); return; }

    if (!rec.mode){
      panel.appendChild(el("h3",{style:"margin-bottom:6px;"},[text("Add a recording")]));
      panel.appendChild(el("div",{class:"rec-note", style:"margin-bottom:18px;"},[text("Record live right here, or import a file you already have.")]));
      panel.appendChild(el("div",{class:"rec-actions"},[
        el("button",{class:"btn btn-primary", onclick: chooseLiveMode},[icon("mic"), text("Record live")]),
        el("button",{class:"btn btn-outline", onclick: chooseImportMode},[icon("upload"), text("Import a file")]),
        el("button",{class:"btn btn-outline", onclick: function(){ rec=null; backToList(); }},[text("Cancel")])
      ]));
      content.appendChild(panel); return;
    }

    if (rec.mode === "import"){
      var titleInputI = el("input",{class:"rec-title-input", value: rec.title});
      titleInputI.addEventListener("input", function(){ rec.title = titleInputI.value; });
      panel.appendChild(titleInputI);
      if (rec.error) panel.appendChild(el("div",{class:"rec-warn"},[text(rec.error)]));

      var fileInput = el("input",{type:"file", accept:"audio/*,video/*"});
      fileInput.addEventListener("change", function(){ rec.file = fileInput.files && fileInput.files[0]; });
      panel.appendChild(el("div",{class:"panel-label"},[text("Audio file")]));
      panel.appendChild(el("div",{style:"margin-bottom:18px;"},[fileInput]));

      panel.appendChild(renderTranscriptField(
        "Transcript (optional)",
        "Paste a transcript here, or upload a .txt file from a previous recording.",
        function(){ return rec.pastedTranscript; },
        function(v){ rec.pastedTranscript = v; }
      ));

      panel.appendChild(renderSlidePicker(
        function(){ return rec.slideFiles; },
        function(v){ rec.slideFiles = v; }
      ));

      panel.appendChild(el("div",{class:"rec-actions"},[
        el("button",{class:"btn btn-primary", disabled: rec.uploading, onclick: beginImportUpload},[text(rec.uploading ? "Uploading…" : "Save recording")]),
        el("button",{class:"btn btn-outline", disabled: rec.uploading, onclick: function(){ rec=null; backToList(); }},[text("Cancel")])
      ]));
      content.appendChild(panel); return;
    }

    // live mode
    if (!rec.active){
      var titleInput = el("input",{class:"rec-title-input", value: rec.title});
      titleInput.addEventListener("input", function(){ rec.title = titleInput.value; });
      panel.appendChild(titleInput);
      if (rec.error) panel.appendChild(el("div",{class:"rec-warn"},[text(rec.error)]));
      if (!rec.supportsSpeech) panel.appendChild(el("div",{class:"rec-note", style:"margin-bottom:16px;"},[text("Live transcription isn't supported in this browser — audio will still record fine.")]));
      panel.appendChild(renderTranscriptField(
        "Transcript from a previous recording (optional)",
        "Paste text here, or upload a .txt file — it'll be placed before whatever gets recorded live, so the two read as one continuous transcript.",
        function(){ return rec.priorTranscript; },
        function(v){ rec.priorTranscript = v; }
      ));
      panel.appendChild(renderSlidePicker(
        function(){ return rec.slideFiles; },
        function(v){ rec.slideFiles = v; }
      ));
      panel.appendChild(el("div",{class:"rec-actions"},[
        el("button",{class:"btn btn-primary", onclick: beginCapture},[icon("mic"), text("Start recording")]),
        el("button",{class:"btn btn-outline", onclick: function(){ rec=null; backToList(); }},[text("Cancel")])
      ]));
      content.appendChild(panel); return;
    }

    var titleInput2 = el("input",{class:"rec-title-input", value: rec.title});
    titleInput2.addEventListener("input", function(){ rec.title = titleInput2.value; });
    panel.appendChild(titleInput2);
    if (rec.error) panel.appendChild(el("div",{class:"rec-warn"},[text(rec.error)]));
    panel.appendChild(el("div",{class:"rec-status"},[
      el("div",{class:"rec-dot" + (rec.finishing ? "" : " live")}),
      el("div",{class:"rec-timer mono", id:"recTimer"},[text(fmtTimer(rec.elapsedSec))]),
      el("div",{class:"rec-note"},[text(rec.uploading ? "Saving…" : (rec.finishing ? "Finishing up…" : "Recording"))])
    ]));
    var captionSnippetInit = captionSnippet((rec.finalTranscript || "") + (rec.interimTranscript || ""), 130);
    var captionEl = el("div",{class:"live-caption" + (captionSnippetInit ? "" : " empty"), id:"liveCaption"},[
      text(captionSnippetInit || emptyCaptionMessage())
    ]);
    panel.appendChild(captionEl);
    if (AI_ENABLED) panel.appendChild(el("div",{class:"rec-note", style:"margin:-4px 0 14px;"},[text("AI is also quietly re-checking the actual audio every 30 seconds for extra accuracy — that's what gets saved.")]));
    panel.appendChild(el("div",{class:"transcript-label"},[text("Full transcript so far")]));
    var transcriptBox = el("div",{class:"rec-transcript", id:"recTranscript"});
    transcriptBox.innerHTML = '<span class="final">' + esc(rec.finalTranscript) + '</span>' + esc(rec.interimTranscript || (rec.supportsSpeech ? "" : "(no live transcript in this browser)"));
    panel.appendChild(transcriptBox);

    if (AI_ENABLED) panel.appendChild(renderLiveAskAI());

    panel.appendChild(el("div",{class:"rec-actions"},[
      el("button",{class:"btn btn-danger", disabled: rec.finishing, onclick: function(){ stopRecordingFlow(false); }},[text(rec.finishing ? "Saving…" : "Stop & save")]),
      el("button",{class:"btn btn-outline", disabled: rec.finishing, onclick: function(){ if (confirm("Discard this recording?")) stopRecordingFlow(true); }},[text("Discard")])
    ]));
    content.appendChild(panel);
  }

  function renderLiveAskAI(){
    var wrap = el("div",{class:"ai-panel", style:"margin-bottom:20px;"});
    wrap.appendChild(el("div",{class:"panel-label"},[text("Ask about what's been said so far")]));
    var answerBox = el("div",{class:"ai-answer", style:"display:none;"});
    var input = el("input",{class:"ask-input", placeholder:"e.g. What did they just say about the midterm?"});
    var askBtn = el("button",{class:"btn btn-primary", onclick: function(){ runAsk(); }},[text("Ask")]);
    function runAsk(){
      var q = input.value.trim();
      if (!q || !rec) return;
      askBtn.setAttribute("disabled","disabled"); askBtn.textContent = "Thinking…";
      answerBox.style.display = ""; answerBox.textContent = "…";
      askAI(q, { transcript: rec.finalTranscript || "" }).then(function(answer){
        answerBox.textContent = answer;
      }).catch(function(err){
        answerBox.textContent = "Couldn't get an answer (" + (err && err.message || err) + ").";
      }).then(function(){
        askBtn.removeAttribute("disabled"); askBtn.textContent = "Ask";
      });
    }
    input.addEventListener("keydown", function(ev){ if (ev.key === "Enter") runAsk(); });
    wrap.appendChild(el("div",{style:"display:flex; gap:8px;"},[input, askBtn]));
    wrap.appendChild(answerBox);
    return wrap;
  }

  function renderDetail(content){
    var e = state.entries.find(function(x){ return x.id === state.currentEntryId; });
    if (!e){ renderEmpty("Not found","This entry may have been deleted."); return; }
    var isLecture = e.type === "lecture";
    var showTranscriptPanel = e.type === "lecture" || e.type === "transcript";
    content.appendChild(el("div",{class:"detail-back", onclick: backToList},[icon("back"), text("All entries")]));
    var titleInput = el("input",{class:"detail-title", value: e.title || ""});
    var saveTitle = debounce(function(){ updateEntry(e.id, {title: titleInput.value}); }, 600);
    titleInput.addEventListener("input", saveTitle);
    content.appendChild(el("div",{class:"detail-title-row"},[
      titleInput,
      el("button",{class:"btn-ghost", title:"Delete", onclick: function(){ deleteEntry(e.id); }},[icon("trash")])
    ]));
    content.appendChild(el("div",{class:"detail-date mono"},[ text(fmtDate(e.date) + (isLecture && e.durationSec ? " · " + fmtDuration(e.durationSec) : "")) ]));

    if (isLecture && e.audioPath){
      var playerRow = el("div",{class:"player-row"});
      var audioEl = document.createElement("audio");
      audioEl.controls = true;
      playerRow.appendChild(audioEl);
      content.appendChild(playerRow);
      var audioUrl = sbPublicUrl(e.audioPath);
      if (audioUrl) audioEl.src = audioUrl;
      else playerRow.appendChild(el("div",{class:"rec-warn"},[text("Couldn't load the audio for this entry.")]));
    }

  function renderSlidesPanel(content, e){
    var panel = el("div",{class:"panel"});
    panel.appendChild(el("div",{class:"panel-label"},[text("Slides")]));
    var grid = el("div",{class:"slides-grid"});
    (e.slidePaths || []).forEach(function(path){
      var url = sbPublicUrl(path);
      var isPdf = /\.pdf($|\?)/i.test(path);
      var card = el("div",{class:"slide-card"});
      if (isPdf){
        var link = el("a",{href:url, target:"_blank", rel:"noopener", class:"slide-pdf"},[text("📄 " + path.split("/").pop())]);
        card.appendChild(link);
      } else {
        var img = document.createElement("img");
        img.src = url; img.className = "slide-thumb";
        var a = el("a",{href:url, target:"_blank", rel:"noopener"},[img]);
        card.appendChild(a);
      }
      card.appendChild(el("button",{class:"btn-ghost slide-remove", title:"Remove", onclick: function(){ removeSlide(e, path); }},[icon("trash")]));
      grid.appendChild(card);
    });
    panel.appendChild(grid);
    var slideInput = el("input",{type:"file", accept:"image/*,.pdf", multiple:"multiple"});
    var slideStatus = el("div",{class:"rec-note", style:"margin-top:8px;"});
    slideInput.addEventListener("change", function(){
      var files = Array.prototype.slice.call(slideInput.files || []);

      slideStatus.textContent = "Uploading " + files.length + " file(s)…";
      Promise.all(files.map(function(f){ return uploadSlide(e, f); })).then(function(){
        slideStatus.textContent = "";
        slideInput.value = "";
      }).catch(function(err){
        slideStatus.textContent = "Couldn't upload: " + (err && err.message || err);
      });
    });
    panel.appendChild(el("div",{style:"margin-top:10px;"},[slideInput]));
    panel.appendChild(slideStatus);
    content.appendChild(panel);

  function openCourseTutorChat(){
    var root = document.getElementById("modalRoot");
    var course = state.courses.find(function(c){ return c.id === state.currentCourseId; });
    var contextText = courseContextText();
    var history = (course && Array.isArray(course.tutorChat)) ? course.tutorChat.slice() : [];
    var sending = false;

    var messagesBox = el("div",{class:"chat-messages"});
    var input = el("input",{class:"ask-input", placeholder:"Ask your tutor anything about this course…"});
    var sendBtn = el("button",{class:"btn btn-primary", onclick: function(){ send(); }},[text("Send")]);
    var clearBtn = el("button",{class:"btn btn-outline", onclick: function(){
      if (!confirm("Clear this chat history?")) return;
      history = [];
      updateCourseData({ tutorChat: [] }).catch(function(){});
      renderMessages();
    }},[text("Clear chat")]);

    function renderMessages(){
      messagesBox.innerHTML = "";
      if (history.length === 0){
        messagesBox.appendChild(el("div",{class:"chat-msg assistant"},[text("Hi, I'm your study tutor for " + (course ? course.name : "this course") + ". Ask me anything about what you've covered so far.")]));
      }
      history.forEach(function(m){
        messagesBox.appendChild(el("div",{class:"chat-msg " + (m.role === "assistant" ? "assistant" : "user")},[text(m.text)]));
      });
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }
    function send(){
      var q = input.value.trim();
      if (!q || sending) return;
      if (!contextText){
        messagesBox.appendChild(el("div",{class:"chat-msg assistant"},[text("This course doesn't have any transcripts or notes yet — add some first so I have material to work with.")]));
        messagesBox.scrollTop = messagesBox.scrollHeight;
        return;
      }
      sending = true;
      input.value = "";
      sendBtn.setAttribute("disabled","disabled");
      history.push({ role:"user", text:q });
      renderMessages();
      var thinking = el("div",{class:"chat-msg assistant thinking"},[text("…")]);
      messagesBox.appendChild(thinking);
      messagesBox.scrollTop = messagesBox.scrollHeight;
      var priorHistory = history.slice(0, -1);
      askAIChat(q, priorHistory, { transcript: contextText }).then(function(answer){
        history.push({ role:"assistant", text:answer });
        if (history.length > 40) history = history.slice(-40);
        updateCourseData({ tutorChat: history }).catch(function(){});
        renderMessages();
      }).catch(function(err){
        history.push({ role:"assistant", text:"Couldn't get an answer (" + (err && err.message || err) + ")." });
        renderMessages();
      }).then(function(){
        sending = false;
        sendBtn.removeAttribute("disabled");
        input.focus();
      });
    }
    input.addEventListener("keydown", function(ev){ if (ev.key === "Enter") send(); });
    renderMessages();
    var modal = el("div",{class:"modal", style:"max-width:560px;"},[
      el("h3",{},[text("Tutor Chat — " + (course ? course.name : "this course"))]),
      messagesBox,
      el("div",{style:"display:flex; gap:8px;"},[input, sendBtn]),
      el("div",{class:"modal-actions", style:"justify-content:space-between; margin-top:14px;"},[
        clearBtn,
        el("button",{class:"btn btn-outline", onclick: closeModal},[text("Close")])
      ])
    ]);
    root.innerHTML = "";
    root.appendChild(el("div",{class:"modal-backdrop", onclick: function(e2){ if (e2.target === e2.currentTarget) closeModal(); }},[modal]));
    setTimeout(function(){ input.focus(); }, 0);
  }
})();
</script>
</body>
</html>
